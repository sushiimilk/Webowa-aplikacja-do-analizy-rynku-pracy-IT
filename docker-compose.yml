services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: rynekit-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - sqldata:/var/opt/mssql

volumes:
  sqldata:
