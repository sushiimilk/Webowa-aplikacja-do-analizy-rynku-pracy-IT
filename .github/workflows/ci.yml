name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore
        run: dotnet restore RynekIT.slnx

      - name: Build
        run: dotnet build RynekIT.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test RynekIT.slnx --no-build --configuration Release

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  scraper:
    name: Scraper (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/scraper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
